# SPDX-License-Identifier: Apache-2.0
#
# S3 parity: Pepper vs MinIO at the single-node durable profile.
#
# This checked-in file is the exploratory template. Qualification runs copy
# it into the artifact directory, raise durations/repetitions/object pools to
# the accepted matrix (see PERFORMANCE_PARITY_HARNESS.md sections 5 and 7),
# and pin the MinIO image digest.
#
# Prerequisites:
# - PEPPER_BENCH_ROOT: empty directory on the XFS device under test;
# - PEPPER_BENCH_CONFIG_DIR: Pepper node configs as generated by the
#   pepper-s3-throughput matrix runner (single topology);
# - the Pepper topology and MinIO topology bind the same filesystem.

version = 1
api = "s3"
title = "S3 parity: Pepper vs MinIO, single-node durable"

[[profiles]]
name = "s3-single-durable"
fault_tolerance = "single node, durable at acknowledgment"

[profiles.claims]
durability = "synced to media before acknowledgment"
consistency = "read-after-write"
replication = "one data copy; Pepper retains its three-voter namespace"

[[targets]]
name = "pepper"
role = "subject"
profile = "s3-single-durable"
endpoint = "http://127.0.0.1:29080"
parser = "s3-loadgen-json"

[targets.lifecycle]
prepare = [
    [
        "bash", "-c",
        "cargo run --release -p pepper-s3-throughput -- prepare-topology --root \"$PEPPER_BENCH_ROOT\"",
    ],
]
up = [
    "docker", "compose",
    "-f", "benchmarks/pepper-s3-throughput/compose.yaml",
    "--profile", "single",
    "up", "-d", "--wait",
]
down = [
    "docker", "compose",
    "-f", "benchmarks/pepper-s3-throughput/compose.yaml",
    "--profile", "single",
    "down", "-v",
]
ready_url = "http://127.0.0.1:29080/readyz"

# Durability audit: write an acknowledged object pool, SIGKILL every node,
# restart, and require every acknowledged object to read back intact.
[targets.audit]
steps = [
    [
        "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
        "loadgen", "--backend", "s3", "--operation", "get",
        "--size", "1048576", "--concurrency", "8", "--object-count", "64",
        "--prepare", "--prepare-only", "--endpoints", "http://127.0.0.1:29080",
        "--quiet",
    ],
    [
        "docker", "compose",
        "-f", "benchmarks/pepper-s3-throughput/compose.yaml",
        "--profile", "single", "kill",
    ],
    [
        "docker", "compose",
        "-f", "benchmarks/pepper-s3-throughput/compose.yaml",
        "--profile", "single", "up", "-d", "--wait",
    ],
    [
        "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
        "loadgen", "--backend", "s3", "--operation", "get",
        "--size", "1048576", "--concurrency", "8", "--object-count", "64",
        "--duration", "5", "--allow-short", "--retries", "0",
        "--fail-on-errors", "--endpoints", "http://127.0.0.1:29080",
        "--quiet",
    ],
]

[targets.measure]
command = [
    "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
    "loadgen",
    "--backend", "s3",
    "--operation", "{operation}",
    "--size", "{payload_size_bytes}",
    "--concurrency", "{concurrency}",
    "--duration", "{duration_seconds}",
    "--object-count", "256",
    "--prepare",
    "--endpoints", "{endpoint}",
    "--quiet",
    "--output", "{output}",
]

[[targets]]
name = "minio"
role = "competitor"
profile = "s3-single-durable"
endpoint = "http://127.0.0.1:29090"
parser = "s3-loadgen-json"

[targets.lifecycle]
up = [
    "docker", "compose",
    "-f", "benchmarks/pepper-parity/topologies/minio-single.yaml",
    "up", "-d", "--wait",
]
down = [
    "docker", "compose",
    "-f", "benchmarks/pepper-parity/topologies/minio-single.yaml",
    "down", "-v",
]
ready_url = "http://127.0.0.1:29090/minio/health/ready"

# Same audit shape as the subject: acknowledged pool, SIGKILL, restart,
# read-back. This settles the pinned image's fsync semantics empirically.
[targets.audit]
steps = [
    [
        "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
        "loadgen", "--backend", "s3", "--operation", "get",
        "--size", "1048576", "--concurrency", "8", "--object-count", "64",
        "--prepare", "--prepare-only", "--endpoints", "http://127.0.0.1:29090",
        "--quiet",
    ],
    [
        "docker", "compose",
        "-f", "benchmarks/pepper-parity/topologies/minio-single.yaml",
        "kill",
    ],
    [
        "docker", "compose",
        "-f", "benchmarks/pepper-parity/topologies/minio-single.yaml",
        "up", "-d", "--wait",
    ],
    [
        "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
        "loadgen", "--backend", "s3", "--operation", "get",
        "--size", "1048576", "--concurrency", "8", "--object-count", "64",
        "--duration", "5", "--allow-short", "--retries", "0",
        "--fail-on-errors", "--endpoints", "http://127.0.0.1:29090",
        "--quiet",
    ],
]

[targets.measure]
command = [
    "cargo", "run", "--release", "-p", "pepper-s3-throughput", "--",
    "loadgen",
    "--backend", "s3",
    "--operation", "{operation}",
    "--size", "{payload_size_bytes}",
    "--concurrency", "{concurrency}",
    "--duration", "{duration_seconds}",
    "--object-count", "256",
    "--prepare",
    "--endpoints", "{endpoint}",
    "--quiet",
    "--output", "{output}",
]

[workload]
operations = ["put", "get"]
payload_sizes_bytes = [4096, 1048576, 67108864]
concurrency = [1, 8, 32]
duration_seconds = 60
warmup_seconds = 10
repetitions = 3

[gates]
throughput_ratio_minimum = 1.0
p99_ratio_maximum = 1.0
tolerance_percent = 5.0
required = true
