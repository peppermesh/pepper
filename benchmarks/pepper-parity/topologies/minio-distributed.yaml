# SPDX-License-Identifier: Apache-2.0
#
# Three-node distributed MinIO for the `s3-replicated-durable` guarantee
# profile: erasure coding across 3 nodes x 2 drives (EC:2 on a 6-drive set),
# synchronous drive writes, so an acknowledged object survives the permanent
# loss of any one node. This is the closest MinIO analogue to Pepper's RF=3
# replicated profile: both tolerate one node loss and serve reads through the
# surviving gateways.
#
# EC:2 is pinned explicitly (the 6-drive default would be EC:3) so the
# fault-tolerance claim — one node = two drives — is exact and the parity
# overhead is the minimum that delivers it. Bind PEPPER_BENCH_ROOT to the same
# filesystem used by the Pepper topology so both systems see the same device.

x-minio: &minio
  image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  command:
    [
      "server",
      "--address", ":9000",
      "http://minio{1...3}:9000/drives/data{1...2}",
    ]
  environment:
    MINIO_ROOT_USER: pepper-benchmark
    MINIO_ROOT_PASSWORD: pepper-benchmark-secret-v1
    MINIO_DRIVE_SYNC: "on"
    MINIO_STORAGE_CLASS_STANDARD: "EC:2"
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 2s
    timeout: 2s
    retries: 60

services:
  minio1:
    <<: *minio
    hostname: minio1
    ports:
      - "127.0.0.1:29090:9000"
    volumes:
      - ${PEPPER_BENCH_ROOT:?set PEPPER_BENCH_ROOT}/minio-dist1:/drives

  minio2:
    <<: *minio
    hostname: minio2
    ports:
      - "127.0.0.1:29091:9000"
    volumes:
      - ${PEPPER_BENCH_ROOT}/minio-dist2:/drives

  minio3:
    <<: *minio
    hostname: minio3
    ports:
      - "127.0.0.1:29092:9000"
    volumes:
      - ${PEPPER_BENCH_ROOT}/minio-dist3:/drives
