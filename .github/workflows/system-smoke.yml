# SPDX-License-Identifier: Apache-2.0

name: system-smoke

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: system-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build shared process binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build process backend binaries and harness once
        run: |
          cargo build --locked -p pepper-agent -p pepper-cli
          cargo build --locked --manifest-path system-tests/Cargo.toml
      - name: Share build artifacts with test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-test-build
          path: |
            target/debug/pepper-agent
            target/debug/pepper
            system-tests/target/debug/pepper-system-test
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke process ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [BOOT-002, BLOCK-001, NS-003, LIN-001, SQLITE-001, SQLITE-003]
    env:
      TOKIO_WORKER_THREADS: "2"
      SYSTEM_TEST_SEED: "20260712"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: system-test-build
      - name: Restore shared binaries
        run: chmod +x target/debug/pepper-agent target/debug/pepper system-tests/target/debug/pepper-system-test
      - name: Run deterministic smoke scenario
        run: >-
          ./system-tests/target/debug/pepper-system-test
          run --scenario "${{ matrix.scenario }}" --seed "$SYSTEM_TEST_SEED"
          --backend process --no-build
      - name: Upload forensic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-process-${{ matrix.scenario }}
          path: system-tests/artifacts/
          if-no-files-found: error
          retention-days: 7
